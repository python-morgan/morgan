---
name: Python Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        platform-version:
          - "ubuntu-24.04"
        include:
          # Python 3.7 only runs on Ubuntu 22.04
          - python-version: "3.7"
            platform-version: "ubuntu-22.04"
    runs-on: ${{ matrix.platform-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
      - name: Test with pytest
        run: |
          pytest

  # Check if the package lower bounds still work with the oldest (3.7 + 3.8)
  # and newest Python versions
  pytest-lowest-deps:
    strategy:
      matrix:
        include:
          - python-version: "3.7"
            platform-version: "ubuntu-22.04"
          - python-version: "3.8"
            platform-version: "ubuntu-24.04"
          - python-version: "3.x"
            platform-version: "ubuntu-26.04"
    runs-on: ${{ matrix.platform-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install lowest allowed dependency versions
        run: |
          uv pip install --system --resolution lowest-direct .[test]
      - name: Test with pytest
        run: |
          pytest

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install ruff based off pyproject.toml
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version-file: "pyproject.toml"

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[lint,test]
      - name: Run MyPy
        run: |
          mypy .
